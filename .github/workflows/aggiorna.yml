name: Aggiorna estrazioni
on:
  schedule:
    - cron: '30 20 * * *'   # ogni sera alle 21:30 ora italiana (inverno), dopo l'estrazione delle 20
    - cron: '30 6 * * *'    # controllo di riserva al mattino
  workflow_dispatch:         # pulsante "Run workflow" per aggiornare a mano
permissions:
  contents: write          # serve solo per salvare data/estrazioni.json
concurrency:
  group: aggiorna-estrazioni
  cancel-in-progress: false  # evita due commit concorrenti sullo stesso file
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/aggiorna.mjs
      - name: Salva se ci sono novità
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add data/estrazioni.json
          git diff --cached --quiet -- data/estrazioni.json || git commit -m "Nuove estrazioni $(date +%F)" && git push
